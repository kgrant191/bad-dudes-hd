name: Publish Bad Dudes HD v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.yml'
      - '.github/release-inputs/approved-v1.0.0.bundle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bad-dudes-hd-release-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPROVED_COMMIT: 31848d6704316aac628477003b1f9b5ba96259b6
      BUNDLE_SHA256: ebe4190a603f35cbc9a2e8081e306a49b938e059b11b3c6cef8d157757a696a5
      ZIP_SHA256: e731cfda7c0f6e37d9f53d18e7a310a566efeace85ae3077abb9c6153836a8ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check whether the verified release is already published
        id: release
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.0.0") | .draft')
          if [[ "$existing" == false ]]; then
            digest=$(gh release view v1.0.0 --json assets --jq '.assets[] | select(.name == "Bad_Dudes_HD_v1.0.0.zip") | .digest')
            test "$digest" = "sha256:$ZIP_SHA256"
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import the approved source checkpoint
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle=.github/release-inputs/approved-v1.0.0.bundle
          echo "$BUNDLE_SHA256  $bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/release/approved-v1.0.0
          test "$(git rev-parse FETCH_HEAD)" = "$APPROVED_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$APPROVED_COMMIT" -m 'Merge approved v1.0.0 including the player/lives font correction'
          git diff --exit-code "$APPROVED_COMMIT" HEAD -- . ':(exclude).github/**'
      - name: Package and validate the approved runtime
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --output "$RUNNER_TEMP/bad-dudes-release"
          echo "$ZIP_SHA256  $RUNNER_TEMP/bad-dudes-release/Bad_Dudes_HD_v1.0.0.zip" | sha256sum --check
      - name: Save the approved source on main
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: git push origin HEAD:main
      - name: Publish the verified install ZIP
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=$(git rev-parse HEAD)
          if draft=$(gh release view v1.0.0 --json isDraft --jq .isDraft); then
            test "$draft" = true
            test "$(gh release view v1.0.0 --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create v1.0.0 --target "$target" --draft --title 'Bad Dudes HD v1.0.0' --notes-file RELEASE_NOTES.md
          fi
          gh release upload v1.0.0 "$RUNNER_TEMP/bad-dudes-release/Bad_Dudes_HD_v1.0.0.zip" --clobber
          digest=$(gh release view v1.0.0 --json assets --jq '.assets[] | select(.name == "Bad_Dudes_HD_v1.0.0.zip") | .digest')
          test "$digest" = "sha256:$ZIP_SHA256"
          gh release edit v1.0.0 --draft=false --latest
